name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: terra
          POSTGRES_PASSWORD: terra
          POSTGRES_DB: terra_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://terra:terra@localhost:5432/terra_ops
      BETTER_AUTH_SECRET: ci-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Migrate
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
